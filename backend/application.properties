# Runtime overrides for local dev
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# write logs to file for post-mortem
logging.file.name=logs/backend.log
logging.level.root=INFO

# Default local database: MariaDB
server.port=${KALC_SERVER_PORT:8081}
spring.datasource.url=${KALC_DB_URL:jdbc:mariadb://localhost:3306/kalc_pos_web?allowMultiQueries=true&serverTimezone=UTC&useSSL=false&allowServerSideCustomAuth=false&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${KALC_DB_USER:root}
spring.datasource.password=${KALC_DB_PASSWORD:Kaisy@3030}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Flyway migrations: baseline on migrate to handle existing schema
spring.flyway.baselineOnMigrate=true

# Character encoding
server.tomcat.uri-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Development: permissive CORS for local front-end (only for dev)
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD,TRACE,OPTIONS
spring.mvc.cors.allowed-headers=*

# Error handling - customize error handling behavior
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
spring.web.resources.add-mappings=false
server.servlet.register-default-servlet=false
spring.mvc.throw-exception-if-no-handler-found=true
