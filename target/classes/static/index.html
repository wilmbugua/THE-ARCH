    <script>
      window.__KALC_DIAGNOSTICS = {
        startTime: performance.now(),
        milestones: []
      };
      function mark(msg) {
        window.__KALC_DIAGNOSTICS.milestones.push({
          msg,
          time: (performance.now() - window.__KALC_DIAGNOSTICS.startTime).toFixed(0) + 'ms'
        });
        console.log('[KALC-DIAG]', msg);
      }
      mark('Page loaded');
      window.addEventListener('error', (e) => {
        mark('ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        console.error('[KALC-ERROR]', e);
      });
      window.addEventListener('unhandledrejection', (e) => {
        mark('UNHANDLED REJECTION: ' + (e.reason ? e.reason.message || e.reason : 'unknown'));
        console.error('[KALC-REJECTION]', e.reason);
      });
      const observer = new MutationObserver((mutations) => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('kalc-startup-fallback');
        if (root && root.children.length > 0 && !(root.children.length === 1 && fallback)) {
          mark('React mounted to root');
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(() => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('kalc-startup-fallback');
        if (!root || root.children.length === 0 || (root.children.length === 1 && fallback)) {
          mark('WARNING: React did not mount after 5 seconds');
          console.log('[KALC-DIAG] Diagnostics:', window.__KALC_DIAGNOSTICS);
        }
      }, 5000);
