<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">KALC POS restaurant service visual</title>
  <desc id="desc">A polished restaurant counter scene with point of sale screens and warm service lighting.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="900" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123B79"/>
      <stop offset=".58" stop-color="#0F2D5C"/>
      <stop offset="1" stop-color="#07182F"/>
    </linearGradient>
    <linearGradient id="counter" x1="144" y1="324" x2="756" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB84D"/>
      <stop offset="1" stop-color="#EF8A23"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F0FF"/>
      <stop offset="1" stop-color="#5B8FE8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="url(#room)"/>
  <g opacity=".26">
    <circle cx="114" cy="78" r="3" fill="#fff"/>
    <circle cx="214" cy="132" r="3" fill="#fff"/>
    <circle cx="714" cy="86" r="3" fill="#fff"/>
    <circle cx="806" cy="166" r="3" fill="#fff"/>
    <path d="M64 236h772" stroke="#fff" stroke-opacity=".18"/>
    <path d="M86 280h728" stroke="#fff" stroke-opacity=".12"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="130" y="330" width="640" height="116" rx="26" fill="url(#counter)"/>
    <rect x="168" y="378" width="564" height="22" rx="11" fill="#fff" opacity=".22"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="322" y="134" width="256" height="176" rx="18" fill="#E2E8F0"/>
    <rect x="340" y="152" width="220" height="124" rx="10" fill="url(#screen)"/>
    <rect x="374" y="292" width="152" height="18" rx="9" fill="#94A3B8"/>
    <rect x="420" y="310" width="60" height="46" rx="8" fill="#CBD5E1"/>
    <rect x="398" y="350" width="104" height="16" rx="8" fill="#E2E8F0"/>
    <rect x="366" y="180" width="92" height="16" rx="8" fill="#0F2D5C" opacity=".78"/>
    <rect x="366" y="208" width="160" height="12" rx="6" fill="#fff" opacity=".8"/>
    <rect x="366" y="232" width="124" height="12" rx="6" fill="#fff" opacity=".62"/>
    <circle cx="518" cy="188" r="22" fill="#EF8A23"/>
  </g>
  <g opacity=".95">
    <rect x="194" y="218" width="92" height="112" rx="18" fill="#F8FAFC"/>
    <rect x="208" y="238" width="64" height="14" rx="7" fill="#2D6CDF"/>
    <rect x="208" y="264" width="52" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="208" y="286" width="64" height="10" rx="5" fill="#CBD5E1"/>
    <circle cx="240" cy="318" r="8" fill="#10B981"/>
  </g>
  <g opacity=".95">
    <circle cx="658" cy="248" r="38" fill="#FFF3E0"/>
    <path d="M620 248h76" stroke="#EF8A23" stroke-width="8" stroke-linecap="round"/>
    <path d="M658 210v76" stroke="#EF8A23" stroke-width="8" stroke-linecap="round"/>
    <circle cx="658" cy="248" r="18" fill="#fff"/>
  </g>
  <text x="48" y="454" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="1">KALC POS</text>
  <text x="50" y="486" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Fast service. Clear orders. Confident checkout.</text>
</svg>
