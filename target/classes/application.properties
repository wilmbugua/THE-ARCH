# Runtime defaults for packaged builds. Environment variables from the start
# scripts still override these values.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.file.name=logs/backend.log
logging.level.root=INFO

server.port=${KALC_SERVER_PORT:8081}
spring.profiles.active=${KALC_ENV_PROFILE:server}

spring.datasource.url=${KALC_DB_URL:jdbc:mariadb://localhost:3306/kalc_pos_web?allowMultiQueries=true&serverTimezone=UTC&useSSL=false&allowServerSideCustomAuth=false&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${KALC_DB_USER:root}
spring.datasource.password=${KALC_DB_PASSWORD:Kaisy@3030}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-missing-migrations=false

server.tomcat.uri-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

spring.mvc.cors.allow-credentials=true
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD,TRACE
spring.mvc.cors.allowed-headers=*

server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
spring.web.resources.add-mappings=false
server.servlet.register-default-servlet=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Keep the documented POS login users available after database/browser restarts.
# Set KALCPOS_DEFAULT_USERS_SYNC=false if an installation manages these users manually.
kalcpos.default-users.sync=${KALCPOS_DEFAULT_USERS_SYNC:true}
